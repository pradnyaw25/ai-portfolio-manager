name: Daily Portfolio Run

on:
  schedule:
    # Twice on weekdays, serving the 14:40 and 17:50 UTC slots - but each cron fires
    # 4.5 HOURS EARLY and the "Wait for the slot" step sleeps until the slot time.
    #
    # Why: GitHub's scheduler is the binding constraint, not the clock. Through July
    # it started this repo's runs 59-101 minutes late and the cron times budgeted for
    # that. From late August the delay drifted to a median of ~105 min, p90 ~220 min,
    # max 476 min - past the budget - and the market-hours guard (which aborts the
    # WHOLE run outside 9:30am-4:00pm America/New_York) silently skipped the result:
    # four whole trading days lost (08-27, 08-28, 08-31, 09-28) and, from 09-01, the
    # afternoon slot skipped on 21 of 23 days. See docs/incidents.md.
    #
    # Firing early and sleeping absorbs the delay instead of budgeting for it: on time
    # means a 4.5h wait, 3h late means a 1.5h wait, past the slot means no wait (the
    # guard then decides, exactly as before). Runner minutes are free on a public repo.
    # The slots themselves are unchanged and still land in-hours in both DST seasons
    # (14:30-20:00 UTC), on their side of RECEIPTS_MORNING_CUTOFF_HOUR_UTC (17): the
    # morning run posts receipts, the afternoon run the spotlight.
    #
    # Each cron MUST have a matching entry in SLOT_TARGETS below, or the wait step
    # fails rather than guess. Delays beyond the headroom still lose the slot; the
    # run-health watchdog pages on a missing slot now, so that is no longer silent.
    - cron: "10 10 * * 1-5"   # serves the 14:40 UTC slot
    - cron: "20 13 * * 1-5"   # serves the 17:50 UTC slot

  workflow_dispatch:

env:
  # cron -> the UTC slot it serves. Read by scripts/wait_for_slot.py; pinned by
  # tests/test_daily_schedule.py.
  SLOT_TARGETS: "10 10 * * 1-5=14:40,20 13 * * 1-5=17:50"

permissions:
  contents: write
  pages: write
  id-token: write

# One group per cron slot, NOT a single shared "pages" group.
#
# Both daily runs used to sit in the same group as each other (and as deploy-pages).
# A group holds at most one in-progress plus one pending run: when a third enters, the
# PENDING one is cancelled. On 2026-08-06 the scheduler was ~103 min late on the
# morning slot and ~4h45m late on the afternoon one; the morning run was still queued
# when the afternoon run arrived, so it was cancelled outright and the fund lost the
# whole trading day (the afternoon retry then landed after the close and the
# market-hours guard correctly skipped it).
#
# Keying on the cron expression keeps each slot serialized against itself — a second
# morning run still waits for the first — while making the two slots independent, so a
# delay in one can no longer evict the other. workflow_dispatch has no
# github.event.schedule, so it falls back to a per-run group and never queues.
#
# The cost: the two slots' jobs now overlap routinely (each sleeps for hours before
# its slot), so a late morning run can race the afternoon one to the branch. The
# push step below rebases and retries to stay safe under that.
concurrency:
  group: daily-run-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Stdlib only, runs before pip install. Sleeps until this cron's slot time; a
      # manual dispatch has no slot and doesn't wait.
      - name: Wait for the slot
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python scripts/wait_for_slot.py

      # The checkout above is up to 4.5h old by now and the OTHER slot has usually
      # pushed in between. Running the cycle on a stale checkout would re-decide the
      # morning's trades on yesterday's state, so fast-forward before anything reads
      # data/. ff-only: if this can't fast-forward something is genuinely wrong.
      - name: Refresh checkout
        run: |
          git pull --ff-only origin main

      - name: Check market hours
        id: market-hours
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/market_hours_guard.py

      - name: Install dependencies
        if: steps.market-hours.outputs.should_run == 'true'
        run: |
          pip install -U pip
          pip install -e .

      # continue-on-error so a failed cycle still journals and publishes below; the
      # "Report run failure" step at the end turns the job red. Without that pairing
      # we'd trade one silent failure mode for another (a red job that loses the
      # audit trail of what went wrong).
      - name: Run portfolio manager
        id: portfolio-run
        if: steps.market-hours.outputs.should_run == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POST_TWEET: "true"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/daily_run.py

      - name: Commit updated public files
        if: steps.market-hours.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f public data reports

          git diff --staged --quiet || \
          git commit -m "Daily portfolio update"

      # Retry with a rebase: the two cron slots are no longer serialized against each
      # other, so a badly delayed run can race a later one to the same branch. The
      # data files are append-mostly and each run's writes are idempotent, so replaying
      # this run's commit on top of the other one is the correct resolution.
      - name: Push changes
        if: steps.market-hours.outputs.should_run == 'true'
        run: |
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on origin/main and retrying"
            git pull --rebase origin main
          done
          echo "::error::Could not push after 3 attempts"
          exit 1

      - name: Setup Pages
        if: steps.market-hours.outputs.should_run == 'true'
        uses: actions/configure-pages@v6

      - name: Upload static site
        if: steps.market-hours.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.market-hours.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # The journal and the site are published by now, so failing here loses nothing
      # and is the only signal that the cycle didn't actually reach a decision.
      - name: Report run failure
        if: steps.portfolio-run.outcome == 'failure'
        run: |
          echo "::error::Daily portfolio run failed - see data/run_history.jsonl for the failed step and errors"
          exit 1
