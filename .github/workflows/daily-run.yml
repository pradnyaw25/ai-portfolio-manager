name: Daily Portfolio Run

on:
  schedule:
    # Twice on weekdays, serving the 14:40 and 17:50 UTC slots. Each slot is ONE cron
    # expression that fires every two hours from ~10 hours before the slot; every fire
    # sleeps until the slot ("Wait for the slot" below), and the first fire to reach
    # it runs the cycle while the rest find the slot already served and exit green.
    #
    # Why: GitHub's scheduler is the binding constraint, not the clock. Through July
    # 2026 it started this repo's runs 59-101 minutes late; from late August the
    # median was ~105 min (max 476); in November 2026 the median was ~8.5 HOURS (AM
    # p90 627 min, max 710). The single early cron per slot (10:10 / 13:20, 4.5h of
    # headroom) that fixed the September incident was outrun by the November one: the
    # afternoon run landed after the close on most days and was skipped, the morning
    # run landed after the receipts cutoff and was mistaken for the afternoon one (no
    # receipts tweet all month), and on 2026-11-23 both landed after the close and the
    # day was lost. See docs/incidents.md.
    #
    # Firing many times absorbs the delay instead of budgeting for it. A fire more than
    # MAX_WAIT_MINUTES (5h) before its slot starts at once, lands before the open and
    # is skipped by the market-hours guard; a fire inside the 5h window sleeps to the
    # slot; a fire after the slot starts at once and runs if the slot is still unserved
    # and the market is open. Fires are 2h apart, so for any delay from 0 to 10h at
    # least two fires land inside the window. Runner minutes are free on a public repo.
    #
    # One EXPRESSION per slot, not one cron per fire: the concurrency group below is
    # keyed on github.event.schedule, so all fires of a slot share a group and GitHub
    # serializes them - two fires sleeping to the same slot can never both run the
    # cycle. (A group holds one running + one pending job and cancels an older pending
    # one when a newer arrives, so a few "cancelled" backup fires per day are normal.)
    #
    # Each expression MUST have a matching entry in SLOT_TARGETS below, or the wait
    # step fails rather than guess. The slots themselves are unchanged and land
    # in-hours in both DST seasons, on their side of RECEIPTS_MORNING_CUTOFF_HOUR_UTC
    # (17): the morning run posts receipts, the afternoon run the spotlight. The run
    # also records WHICH slot it served, so a late morning run is still the morning run.
    - cron: "40 4,6,8,10,12 * * 1-5"    # serves the 14:40 UTC slot
    - cron: "50 7,9,11,13,15 * * 1-5"   # serves the 17:50 UTC slot

  workflow_dispatch:

env:
  # cron expression -> the UTC slot it serves, ';'-separated (the expressions contain
  # commas). Read by scripts/wait_for_slot.py; pinned by tests/test_daily_schedule.py.
  SLOT_TARGETS: "40 4,6,8,10,12 * * 1-5=14:40;50 7,9,11,13,15 * * 1-5=17:50"

permissions:
  contents: write
  pages: write
  id-token: write

# One group per cron EXPRESSION, i.e. per slot - NOT a single shared "pages" group.
#
# Both daily runs used to sit in the same group as each other (and as deploy-pages).
# A group holds at most one in-progress plus one pending run: when a third enters, the
# PENDING one is cancelled. On 2026-08-06 the scheduler was ~103 min late on the
# morning slot and ~4h45m late on the afternoon one; the morning run was still queued
# when the afternoon run arrived, so it was cancelled outright and the fund lost the
# whole trading day (the afternoon retry then landed after the close and the
# market-hours guard correctly skipped it).
#
# Keying on the cron expression keeps each slot serialized against itself - every
# backup fire of a slot queues behind the fire that is sleeping to it, then finds the
# slot served and exits - while making the two slots independent, so a delay in one
# can never evict the other. workflow_dispatch has no github.event.schedule, so it
# falls back to a per-run group and never queues.
#
# The cost: the two slots' jobs overlap routinely (each sleeps for hours before its
# slot), so a late morning run can race the afternoon one to the branch. The push
# step below rebases and retries to stay safe under that.
concurrency:
  group: daily-run-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Stdlib only, runs before pip install. Sleeps until this cron's slot time; a
      # manual dispatch has no slot and doesn't wait. Also resolves WHICH slot this
      # fire serves (morning/afternoon) and how late the scheduler was, as step
      # outputs that the steps below and the run_history row carry.
      - name: Wait for the slot
        id: wait
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python scripts/wait_for_slot.py

      # The checkout above is up to 5h old by now and the OTHER slot - or an earlier
      # fire of THIS one - has usually pushed in between. Running the cycle on a stale
      # checkout would re-decide the morning's trades on yesterday's state, so
      # fast-forward before anything reads data/. ff-only: if this can't fast-forward
      # something is genuinely wrong.
      - name: Refresh checkout
        run: |
          git pull --ff-only origin main

      # Stdlib only. A slot is served once per trading day: if data/run_history.jsonl
      # already holds a row for today's market date and this slot, this is a backup
      # fire and the job ends here, green, with no cycle. Manual dispatches skip this.
      - name: Check slot already served
        id: slot-check
        env:
          RUN_SLOT: ${{ steps.wait.outputs.slot }}
          RUN_SLOT_TIME: ${{ steps.wait.outputs.slot_time }}
        run: |
          python scripts/slot_already_served.py

      # Prints a ::warning:: naming the slot, the fire time and the scheduler delay
      # when it skips a scheduled run, so a green-but-skipped run can be told apart
      # from a green run in the Actions list.
      - name: Check market hours
        id: market-hours
        if: steps.slot-check.outputs.already_served != 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_SLOT: ${{ steps.wait.outputs.slot }}
          RUN_SLOT_TIME: ${{ steps.wait.outputs.slot_time }}
          RUN_CRON: ${{ steps.wait.outputs.cron }}
          RUN_FIRED_AT: ${{ steps.wait.outputs.fired_at }}
          RUN_SCHEDULER_DELAY_MIN: ${{ steps.wait.outputs.delay_min }}
        run: |
          python scripts/market_hours_guard.py

      - name: Install dependencies
        if: steps.market-hours.outputs.should_run == 'true'
        run: |
          pip install -U pip
          pip install -e .

      # continue-on-error so a failed cycle still journals and publishes below; the
      # "Report run failure" step at the end turns the job red. Without that pairing
      # we'd trade one silent failure mode for another (a red job that loses the
      # audit trail of what went wrong).
      - name: Run portfolio manager
        id: portfolio-run
        if: steps.market-hours.outputs.should_run == 'true'
        continue-on-error: true
        env:
          # Which slot this run serves, from the cron that fired (empty on manual
          # dispatch). Written to the run_history row as `slot` and used to pick the
          # morning (receipts) vs afternoon (spotlight) behaviour, so a late morning
          # run is still the morning run whatever the clock says.
          RUN_SLOT: ${{ steps.wait.outputs.slot }}
          RUN_SLOT_TIME: ${{ steps.wait.outputs.slot_time }}
          RUN_CRON: ${{ steps.wait.outputs.cron }}
          RUN_FIRED_AT: ${{ steps.wait.outputs.fired_at }}
          RUN_SCHEDULER_DELAY_MIN: ${{ steps.wait.outputs.delay_min }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Multi-model live calibration. Turn on from repository settings, no commit
          # needed: set the CALIBRATION_SHADOW_ROUTES variable (e.g.
          # "groq:llama-3.3-70b-versatile,openai:gpt-5.6-luna") and the GROQ_API_KEY
          # secret. Empty = off. A missing key just leaves that provider unregistered.
          CALIBRATION_SHADOW_ROUTES: ${{ vars.CALIBRATION_SHADOW_ROUTES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POST_TWEET: "true"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scripts/daily_run.py

      - name: Commit updated public files
        if: steps.market-hours.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f public data reports

          git diff --staged --quiet || \
          git commit -m "Daily portfolio update"

      # Retry with a rebase: the two cron slots are not serialized against each
      # other, so a badly delayed run can race a later one to the same branch. The
      # data files are append-mostly and each run's writes are idempotent, so replaying
      # this run's commit on top of the other one is the correct resolution.
      - name: Push changes
        if: steps.market-hours.outputs.should_run == 'true'
        run: |
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on origin/main and retrying"
            git pull --rebase origin main
          done
          echo "::error::Could not push after 3 attempts"
          exit 1

      - name: Setup Pages
        if: steps.market-hours.outputs.should_run == 'true'
        uses: actions/configure-pages@v6

      - name: Upload static site
        if: steps.market-hours.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.market-hours.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # The journal and the site are published by now, so failing here loses nothing
      # and is the only signal that the cycle didn't actually reach a decision.
      - name: Report run failure
        if: steps.portfolio-run.outcome == 'failure'
        run: |
          echo "::error::Daily portfolio run failed - see data/run_history.jsonl for the failed step and errors"
          exit 1
